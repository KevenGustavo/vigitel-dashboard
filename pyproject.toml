[project]
name = "vigitel-dashboard"
version = "0.1.0"
description = "Dashboard analítico de Atividade Física e Sedentarismo — VIGITEL (TCC)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

