services:
  db:
    image: postgres:18-alpine
    container_name: vigitel_db
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_v18:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vigitel_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-vigitel_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: vigitel_api
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    ports:
      - "8080:8080"
    networks:
      - vigitel_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    container_name: vigitel_web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - vigitel_net
    restart: unless-stopped

networks:
  vigitel_net:
    driver: bridge

volumes:
  pgdata_v18:
