version: '3.8'

services:
  jupyter:
    image: python:3.11-slim
    container_name: vigitel_discovery
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "pip install -r requirements.txt && 
               jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''"
